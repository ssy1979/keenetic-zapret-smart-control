name: KZSC CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Shell syntax
        run: |
          set -eu
          find opt -type f -exec sh -c '
            for file do
              case "$(head -n1 "$file")" in "#!"*sh*) sh -n "$file";; esac
            done
          ' sh {} +
          sh -n install.sh tests/test-adaptive-wan.sh tests/test-ipv6-runtime.sh tests/test-zapret2-ui.sh tests/test-bootstrap.sh tests/test-daemon-lifecycle.sh tests/test-updater.sh
      - name: Adaptive WAN regression suite
        run: sh tests/test-adaptive-wan.sh
      - name: IPv6 runtime regression suite
        run: sh tests/test-ipv6-runtime.sh
      - name: Zapret2 UI bilingual regression suite
        run: sh tests/test-zapret2-ui.sh
      - name: Self-preparing installer regression suite
        run: sh tests/test-bootstrap.sh
      - name: Secure updater regression suite
        run: sh tests/test-updater.sh
      - name: Daemon lifecycle regression suite
        run: sh tests/test-daemon-lifecycle.sh
      - name: Blockcheck lifecycle regression suite
        run: sh tests/test-blockcheck-lifecycle.sh
      - name: Repository ownership contract
        run: sh tests/test-repository-contract.sh
      - name: Runtime audit contract
        run: sh tests/test-audit-contract.sh
      - name: Release payload regression tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Windows preparer regression suite
        run: |
          python -m pip install -r tools/kzsc-hazirlayici/requirements.txt
          python -m unittest discover -s tools/kzsc-hazirlayici/tests -v
      - name: Release checksum manifest
        run: |
          python tools/release_contract.py verify
          python tools/release_contract.py build --output dist
      - name: Secret and local-path guard
        run: |
          set -eu
          ! grep -RIE 'BEGIN (RSA|OPENSSH|EC) PRIV[A]TE KEY|/Users/[^/]+/|TG_TOKE[N]="[0-9]{5,}:[A-Za-z0-9_-]{20,}"|TG_CHAT_I[D]="-?[0-9]{5,}"' . \
            --exclude-dir=.git --exclude=ci.yml
          ! grep -RIE 'C:\\Use[r]s\\' . --exclude-dir=.git --exclude=ci.yml

  windows-preparer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build and launch packaged preparer offline
        shell: pwsh
        run: ./tools/build-preparer.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: tested-windows-preparer
          path: KZSC-Hazirlayici-v*.zip*
          if-no-files-found: error
