name: KZSC macOS application preview

on:
  workflow_dispatch:
  push:
    paths:
      - 'tools/kzsc-macos/**'
      - 'tools/kzsc-assets/**'
      - '.github/workflows/macos-app.yml'
  pull_request:
    paths:
      - 'tools/kzsc-macos/**'
      - 'tools/kzsc-assets/**'
      - '.github/workflows/macos-app.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build usable macOS application
        run: |
          set -eu
          artifact_version="0.0.${GITHUB_RUN_NUMBER}"
          chmod +x tools/kzsc-macos/build-app.sh
          tools/kzsc-macos/build-app.sh dist "$artifact_version"
          (
            cd dist
            shasum -a 256 -c "KZSCMacOS-v${artifact_version}-macos.zip.sha256"
          )
      - name: Store macOS application
        uses: actions/upload-artifact@v4
        with:
          name: KZSC-macOS-preview
          path: |
            dist/KZSCMacOS-*.zip
            dist/KZSCMacOS-*.zip.sha256
          if-no-files-found: error
