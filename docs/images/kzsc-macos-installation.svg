<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">KZSC macOS yönlendirmeli kurulum</title>
  <desc id="desc">Dört adım: KZSC macOS'u aç, ana router SSH parmak izini doğrula, parolaları gir, kur ve paneli aç.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081827"/><stop offset="1" stop-color="#102b40"/></linearGradient>
    <style>.h{font:700 28px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}.s{font:400 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#bcd0df}.n{font:700 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#082238}.t{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}.d{font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#c8d7e4}.box{fill:#153850;stroke:#3e91bf;stroke-width:1.5}.ok{fill:#164b39;stroke:#63dd8d;stroke-width:1.5}</style>
  </defs>
  <rect width="1200" height="450" rx="26" fill="url(#bg)"/>
  <text class="h" x="48" y="58">KZSC macOS: Terminal kullanmadan kurulum ve kontrol</text>
  <text class="s" x="48" y="88">Uygulama ana Keenetic router'ı bulur, SSH'i doğrular, güvenilir sürümü kurar ve paneli açar.</text>
  <g transform="translate(48 130)">
    <rect class="box" width="245" height="230" rx="18"/><circle cx="32" cy="32" r="20" fill="#55c5f4"/><text class="n" x="25" y="40">1</text><text class="t" x="24" y="82">KZSC macOS'u aç</text><text class="d" x="24" y="111">macOS ZIP'ini GitHub</text><text class="d" x="24" y="133">Release'den indirin.</text><text class="d" x="24" y="164">Gatekeeper sorarsa sağ</text><text class="d" x="24" y="186">tıklayıp Aç'ı seçin.</text>
    <path d="M258 112h42l-13-10v20z" fill="#55c5f4"/>
    <g transform="translate(305)"><rect class="box" width="245" height="230" rx="18"/><circle cx="32" cy="32" r="20" fill="#55c5f4"/><text class="n" x="25" y="40">2</text><text class="t" x="24" y="82">Router'ı doğrula</text><text class="d" x="24" y="111">Yerel LAN'ı tara veya router</text><text class="d" x="24" y="133">adresini elle yazın.</text><text class="d" x="24" y="164">222/22 ED25519 SSH</text><text class="d" x="24" y="186">parmak izini onaylayın.</text></g>
    <path d="M563 112h42l-13-10v20z" fill="#55c5f4"/>
    <g transform="translate(610)"><rect class="box" width="245" height="230" rx="18"/><circle cx="32" cy="32" r="20" fill="#55c5f4"/><text class="n" x="25" y="40">3</text><text class="t" x="24" y="82">Parolaları gir</text><text class="d" x="24" y="111">SSH 22 kurulumu için web</text><text class="d" x="24" y="133">yönetici parolasını kullanın.</text><text class="d" x="24" y="164">Yeni Entware root hesabı</text><text class="d" x="24" y="186">varsayılanı root / keenetic.</text></g>
    <path d="M868 112h42l-13-10v20z" fill="#55c5f4"/>
    <g transform="translate(915)"><rect class="ok" width="237" height="230" rx="18"/><circle cx="32" cy="32" r="20" fill="#62df8a"/><text class="n" x="25" y="40">4</text><text class="t" x="24" y="82">Uygulamadan kur</text><text class="d" x="24" y="111">Uygulama son güvenilir KZSC</text><text class="d" x="24" y="133">sürümünü indirip doğrular.</text><text class="d" x="24" y="164">Eksikleri tamamlar, yeniden</text><text class="d" x="24" y="186">bağlanır ve :9090'u açar.</text></g>
  </g>
</svg>
