<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
<title id="title">WinSCP and PuTTY connection fields</title><desc id="desc">Example WinSCP SFTP port 222 transfer and PuTTY SSH port 222 connection fields.</desc>
<rect width="1120" height="430" rx="16" fill="#f6f8fa"/><g font-family="Segoe UI,Arial,sans-serif"><text x="35" y="38" font-size="22" font-weight="700" fill="#24292f">WinSCP — drag files to /opt/tmp</text><rect x="35" y="55" width="520" height="325" rx="10" fill="#fff" stroke="#8c959f"/><rect x="35" y="55" width="520" height="42" rx="10" fill="#0969da"/><text x="52" y="83" font-size="17" fill="#fff" font-weight="600">SFTP login</text><text x="55" y="130" font-size="15" fill="#57606a">File protocol</text><rect x="210" y="111" width="300" height="32" fill="#fff" stroke="#8c959f"/><text x="222" y="133" font-size="15" fill="#24292f">SFTP</text><text x="55" y="175" font-size="15" fill="#57606a">Host</text><rect x="210" y="156" width="300" height="32" fill="#fff" stroke="#8c959f"/><text x="222" y="178" font-size="15" fill="#24292f">192.168.1.1</text><text x="55" y="220" font-size="15" fill="#57606a">Port</text><rect x="210" y="201" width="100" height="32" fill="#fff3cd" stroke="#d4a72c"/><text x="245" y="223" font-size="15" fill="#24292f">222</text><text x="55" y="265" font-size="15" fill="#57606a">Username</text><rect x="210" y="246" width="300" height="32" fill="#fff" stroke="#8c959f"/><text x="222" y="268" font-size="15" fill="#24292f">root</text><rect x="65" y="305" width="210" height="48" fill="#ddf4ff" stroke="#54aeff"/><text x="82" y="334" font-size="15" fill="#0969da">PC: archive + .sha256</text><path d="M290 329h90" stroke="#0969da" stroke-width="4"/><path d="m370 319 15 10-15 10" fill="none" stroke="#0969da" stroke-width="4"/><rect x="395" y="305" width="135" height="48" fill="#dafbe1" stroke="#1a7f37"/><text x="409" y="334" font-size="15" fill="#1a7f37">/opt/tmp</text><text x="600" y="38" font-size="22" font-weight="700" fill="#24292f">PuTTY — SSH terminal</text><rect x="600" y="55" width="485" height="325" rx="10" fill="#1f2328" stroke="#8c959f"/><rect x="600" y="55" width="485" height="42" rx="10" fill="#57606a"/><text x="620" y="83" font-size="17" fill="#fff" font-weight="600">PuTTY Configuration</text><text x="630" y="137" font-size="15" fill="#d0d7de">Host Name</text><rect x="760" y="113" width="280" height="34" fill="#fff"/><text x="774" y="136" font-size="15" fill="#24292f">192.168.1.1</text><text x="630" y="187" font-size="15" fill="#d0d7de">Port</text><rect x="760" y="163" width="100" height="34" fill="#fff3cd"/><text x="795" y="186" font-size="15" fill="#24292f">222</text><text x="630" y="237" font-size="15" fill="#d0d7de">Connection type</text><rect x="760" y="213" width="100" height="34" fill="#dafbe1"/><text x="782" y="236" font-size="15" fill="#1a7f37">SSH</text><rect x="890" y="285" width="150" height="48" fill="#2da44e"/><text x="935" y="315" font-size="16" fill="#fff" font-weight="600">Open</text><text x="630" y="285" font-size="14" fill="#8c959f">login as: root</text><text x="630" y="315" font-size="14" fill="#8c959f">password: (hidden)</text></g></svg>
