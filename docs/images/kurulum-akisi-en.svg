<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="360" viewBox="0 0 1400 360" role="img" aria-labelledby="title desc">
  <title id="title">KZSC assisted installation flow</title>
  <desc id="desc">Five steps from downloading the Windows preparer to opening the KZSC web panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#08131f"/><stop offset="1" stop-color="#10283c"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/></filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#4cc2ff"/></marker>
  </defs>
  <rect width="1400" height="360" rx="28" fill="url(#bg)"/>
  <text x="60" y="58" fill="#fff" font-family="Segoe UI,Arial,sans-serif" font-size="30" font-weight="700">KZSC: one project, two cooperating parts</text>
  <text x="60" y="90" fill="#a9bfd0" font-family="Segoe UI,Arial,sans-serif" font-size="17">The preparer builds the base on Windows; KZSC runs on the Keenetic.</text>
  <g font-family="Segoe UI,Arial,sans-serif" filter="url(#shadow)">
    <g transform="translate(55 125)"><rect width="230" height="165" rx="18" fill="#142f44" stroke="#2e6b91"/><circle cx="35" cy="35" r="21" fill="#4cc2ff"/><text x="35" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#062034">1</text><text x="28" y="82" font-size="20" font-weight="700" fill="#fff">Download Windows tool</text><text x="28" y="112" font-size="15" fill="#c6d6e2">Extract the ZIP fully</text><text x="28" y="137" font-size="15" fill="#c6d6e2">Run the EXE in its folder</text></g>
    <path d="M292 207 H328" stroke="#4cc2ff" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(335 125)"><rect width="230" height="165" rx="18" fill="#142f44" stroke="#2e6b91"/><circle cx="35" cy="35" r="21" fill="#4cc2ff"/><text x="35" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#062034">2</text><text x="28" y="82" font-size="20" font-weight="700" fill="#fff">Analyze the device</text><text x="28" y="112" font-size="15" fill="#c6d6e2">Discover it on the LAN</text><text x="28" y="137" font-size="15" fill="#c6d6e2">Connect over Keenetic SSH 22</text></g>
    <path d="M572 207 H608" stroke="#4cc2ff" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(615 125)"><rect width="230" height="165" rx="18" fill="#142f44" stroke="#2e6b91"/><circle cx="35" cy="35" r="21" fill="#4cc2ff"/><text x="35" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#062034">3</text><text x="28" y="82" font-size="20" font-weight="700" fill="#fff">Choose options</text><text x="28" y="112" font-size="15" fill="#c6d6e2">USB or internal storage</text><text x="28" y="137" font-size="15" fill="#c6d6e2">DNS is managed in KZSC later</text></g>
    <path d="M852 207 H888" stroke="#4cc2ff" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(895 125)"><rect width="230" height="165" rx="18" fill="#142f44" stroke="#2e6b91"/><circle cx="35" cy="35" r="21" fill="#4cc2ff"/><text x="35" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#062034">4</text><text x="28" y="82" font-size="20" font-weight="700" fill="#fff">Review and apply</text><text x="28" y="112" font-size="15" fill="#c6d6e2">Missing items install automatically</text><text x="28" y="137" font-size="15" fill="#c6d6e2">Entware tasks use SSH 222</text></g>
    <path d="M1132 207 H1168" stroke="#4cc2ff" stroke-width="4" marker-end="url(#arrow)"/>
    <g transform="translate(1175 125)"><rect width="170" height="165" rx="18" fill="#153d32" stroke="#41b883"/><circle cx="35" cy="35" r="21" fill="#64e572"/><text x="35" y="42" text-anchor="middle" font-size="20" font-weight="700" fill="#07301f">5</text><text x="28" y="82" font-size="20" font-weight="700" fill="#fff">KZSC ready</text><text x="28" y="112" font-size="15" fill="#d0e9df">Web panel:</text><text x="28" y="137" font-size="15" fill="#d0e9df">ROUTER_IP:9090</text></g>
  </g>
</svg>
