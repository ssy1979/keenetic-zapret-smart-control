<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="450" viewBox="0 0 1200 450" role="img" aria-labelledby="title desc">
  <title id="title">KZSC macOS guided installation</title>
  <desc id="desc">Four steps: open KZSC macOS, verify the main router SSH fingerprint, enter passwords, then install and open the panel.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#081827"/><stop offset="1" stop-color="#102b40"/></linearGradient>
    <style>.h{font:700 28px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}.s{font:400 16px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#bcd0df}.n{font:700 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#082238}.t{font:700 18px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#fff}.d{font:400 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#c8d7e4}.box{fill:#153850;stroke:#3e91bf;stroke-width:1.5}.ok{fill:#164b39;stroke:#63dd8d;stroke-width:1.5}</style>
  </defs>
  <rect width="1200" height="450" rx="26" fill="url(#bg)"/>
  <text class="h" x="48" y="58">KZSC macOS: install and control without Terminal</text>
  <text class="s" x="48" y="88">The app works with the main Keenetic router, verifies SSH, installs the trusted release and opens the panel.</text>
  <g transform="translate(48 130)">
    <rect class="box" width="245" height="230" rx="18"/><circle cx="32" cy="32" r="20" fill="#55c5f4"/><text class="n" x="25" y="40">1</text><text class="t" x="24" y="82">Open KZSC macOS</text><text class="d" x="24" y="111">Download the macOS ZIP</text><text class="d" x="24" y="133">from the GitHub Release.</text><text class="d" x="24" y="164">Right-click → Open if</text><text class="d" x="24" y="186">Gatekeeper asks.</text>
    <path d="M258 112h42l-13-10v20z" fill="#55c5f4"/>
    <g transform="translate(305)"><rect class="box" width="245" height="230" rx="18"/><circle cx="32" cy="32" r="20" fill="#55c5f4"/><text class="n" x="25" y="40">2</text><text class="t" x="24" y="82">Verify the router</text><text class="d" x="24" y="111">Scan the local LAN or enter</text><text class="d" x="24" y="133">the router address manually.</text><text class="d" x="24" y="164">Confirm the ED25519 SSH</text><text class="d" x="24" y="186">fingerprint on port 222/22.</text></g>
    <path d="M563 112h42l-13-10v20z" fill="#55c5f4"/>
    <g transform="translate(610)"><rect class="box" width="245" height="230" rx="18"/><circle cx="32" cy="32" r="20" fill="#55c5f4"/><text class="n" x="25" y="40">3</text><text class="t" x="24" y="82">Enter passwords</text><text class="d" x="24" y="111">Use the Keenetic web-admin</text><text class="d" x="24" y="133">password for SSH 22 setup.</text><text class="d" x="24" y="164">Fresh Entware root defaults</text><text class="d" x="24" y="186">to root / keenetic.</text></g>
    <path d="M868 112h42l-13-10v20z" fill="#55c5f4"/>
    <g transform="translate(915)"><rect class="ok" width="237" height="230" rx="18"/><circle cx="32" cy="32" r="20" fill="#62df8a"/><text class="n" x="25" y="40">4</text><text class="t" x="24" y="82">Install directly</text><text class="d" x="24" y="111">The app downloads and verifies</text><text class="d" x="24" y="133">the latest trusted KZSC release.</text><text class="d" x="24" y="164">It completes prerequisites,</text><text class="d" x="24" y="186">reconnects and opens :9090.</text></g>
  </g>
</svg>
